name: Build and verify Windows pair
on:
  push:
    branches: [main, work/registered-vpn-drive]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Install build tools from the Debian archive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates gcc libc6-dev binutils libllvm19 python3 python3-pypdf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build exactly the reviewed source and run portable tests
        run: |
          python3 -B tools/build.py
          python3 -B tests/check.py
          mkdir unsigned
          cp out/Chazeum-NAS_SERVER.exe out/Chazeum-NAS_USER.exe unsigned/
          python3 -B release/verify_payload.py unsigned
      - id: version
        shell: bash
        run: |
          version="$(cat release/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then [[ "$GITHUB_REF_NAME" == "v$version" ]]; fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-unsigned-input
          path: unsigned/
          if-no-files-found: error
          retention-days: 7
      - name: Get the immutable prior release for the update test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 79deca4f1db738d28957ab59925d921ec9ab630c
          path: previous
          persist-credentials: false
      - name: Build and check the prior client separately from release payloads
        run: |
          cd previous
          python3 -B tools/build.py
          python3 -B release/verify_payload.py out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-previous-client
          path: previous/out/ChaZeumClient.exe
          if-no-files-found: error
          retention-days: 1
  windows_ui:
    name: Open both apps on Windows
    needs: build
    runs-on: windows-2022
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-previous-client
          path: ci-old
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-unsigned-input
          path: unsigned
      - name: Verify both main windows and the first screen; close the apps normally
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class GuiProbe {
            [DllImport("user32.dll", CharSet=CharSet.Unicode, ExactSpelling=true)]
            public static extern IntPtr FindWindowExW(IntPtr parent, IntPtr after, string windowClass, string title);
          }
          '@
          $roles = @(
            @{ exe='Chazeum-NAS_SERVER.exe'; role='서버용'; button='부팅 때 공유 시작' },
            @{ exe='Chazeum-NAS_USER.exe'; role='유저용'; button='서버 주소 저장' }
          )
          foreach ($item in $roles) {
            $title = "$([IO.Path]::GetFileNameWithoutExtension($item.exe)) $env:PRODUCT_VERSION · $($item.role)"
            $app = Start-Process -FilePath (Resolve-Path (Join-Path unsigned $item.exe)).Path -PassThru
            try {
              $timer = [Diagnostics.Stopwatch]::StartNew()
              $ready = $false
              do {
                $app.Refresh()
                if ($app.HasExited) { throw "$($item.exe) exited early: $($app.ExitCode)" }
                $window = $app.MainWindowHandle
                if (($window -ne [IntPtr]::Zero) -and ($app.MainWindowTitle -ceq $title)) {
                  $button = [GuiProbe]::FindWindowExW($window, [IntPtr]::Zero, 'Button', $item.button)
                  if ($button -ne [IntPtr]::Zero) { $ready = $true; break }
                }
                Start-Sleep -Milliseconds 200
              } while ($timer.Elapsed.TotalSeconds -lt 30)
              if (-not $ready) { throw "$($item.exe): expected window and first-screen control were not found; title: $($app.MainWindowTitle)" }
              if (-not $app.CloseMainWindow() -or -not $app.WaitForExit(10000)) { throw "$($item.exe) did not close normally" }
              if ($app.ExitCode -ne 0) { throw "$($item.exe) exited with $($app.ExitCode)" }
              "PASS: $($item.exe) displayed $title and '$($item.button)', then exited with code 0."
            } finally {
              if (-not $app.HasExited) { $app.Kill(); $null = $app.WaitForExit(5000) }
              $app.Dispose()
            }
          }
      - name: Verify a real client upgrade and local SMB access after the server window closes
        shell: pwsh
        run: ./tests/windows-upgrade.ps1
  sign:
    needs: [build, windows_ui]
    # No signing request for pushes, PRs, unprotected refs or before real enrollment.
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_protected && vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-2022
    environment: signpath-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-unsigned-input
          path: unsigned
      - name: Check candidate before submitting the request
        shell: pwsh
        env:
          SIGNER_CERT: ${{ vars.SIGNPATH_CERT_SHA256 }}
        run: |
          if ($env:SIGNER_CERT -notmatch '^[0-9A-Fa-f]{64}$') { throw 'A verified Foundation certificate fingerprint is required.' }
          python release/verify_payload.py unsigned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Request signing through the Foundation; wait for human approval
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ needs.build.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}
      - name: Verify BOTH Windows publisher signatures, timestamps and source-built payloads
        shell: pwsh
        env:
          SIGNER_CERT: ${{ vars.SIGNPATH_CERT_SHA256 }}
        run: |
          ./release/verify-release.ps1 -Unsigned unsigned -Signed signed -ExpectedCertSha256 $env:SIGNER_CERT
          New-Item -ItemType Directory ship -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath signed/Chazeum-NAS_SERVER.exe -Destination 'ship/Chazeum-NAS_SERVER.exe'
          Copy-Item -LiteralPath signed/Chazeum-NAS_USER.exe -Destination 'ship/Chazeum-NAS_USER.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-signed-pair
          if-no-files-found: error
          retention-days: 7
          path: ship/
